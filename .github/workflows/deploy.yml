name: Deploy to GitHub Pages

on:
  # main 또는 작업 브랜치에 푸시되면 배포한다.
  push:
    branches: [main, claude/puzzle-game-lobby-settings-d37ix1]
  # Actions 탭에서 수동 실행도 허용한다.
  workflow_dispatch:

# GITHUB_TOKEN이 Pages에 배포할 수 있도록 권한을 부여한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages가 미설정이면 API로 자동 활성화 시도 (소스: GitHub Actions)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
